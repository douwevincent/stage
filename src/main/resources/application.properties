spring.application.name=stage
# spring.profiles.active=dev

# MySQL Configuration (Default Profile)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stage2?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:stage}
spring.datasource.password=${DB_PASSWORD:_Stage123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# Jackson Configuration for Date Handling
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# File upload configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Notification scheduler configuration
# Planification quotidienne à 07h00 (création des messages en attente)
app.notification.cron.planifier=0 0 7 * * *
# Envoi quotidien à 08h00 (traitement de la file d'attente)
app.notification.cron.envoi=0 0 8 * * *
# Nombre maximum de tentatives d'envoi avant abandon
app.notification.max-tentatives=3
# URL de base de l'application (utilisée pour générer les liens dans les emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Security / Auth
app.security.jwt.secret=${APP_JWT_SECRET:change-me-in-production-very-long-secret-key-1234567890}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Super admin bootstrap
app.security.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@enspm.cm}
app.security.super-admin.password=${SUPER_ADMIN_PASSWORD:ChangeMeNow!123}

# Graceful shutdown configuration for scheduled tasks
# Attendre que toutes les tâches planifiées se terminent lors de l'arrêt (max 60 secondes)
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s
